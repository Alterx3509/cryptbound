<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cryptbound Phaser</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060403;touch-action:none;font-family:Georgia,serif}#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;color:#f3dca8}.panel{position:absolute;border:2px solid #9c783c;background:linear-gradient(#26180eee,#090604ee);box-shadow:inset 0 0 0 1px #d0a454,0 5px 15px #000}.health{left:max(10px,env(safe-area-inset-left));top:9px;width:220px;padding:8px 12px}.health b{font-size:13px}.bar{height:10px;margin-top:5px;border:1px solid #a27c3d;background:#1b0806}.bar i{display:block;width:100%;height:100%;background:linear-gradient(#dc5547,#78100d)}.title{left:50%;top:8px;transform:translateX(-50%);padding:7px 26px;text-align:center;font-weight:bold;letter-spacing:.08em}.title small{display:block;font-size:9px;color:#bda06b}.party{left:max(10px,env(safe-area-inset-left));top:68px;width:145px;padding:7px}.party div{font-size:10px;margin:4px 0}.party span{display:block;height:4px;background:#4b8c48;margin-top:2px}.objective{right:max(10px,env(safe-area-inset-right));top:9px;padding:8px 12px;font-size:11px}
#joy{position:fixed;z-index:30;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;border:4px ridge #8d7249;background:radial-gradient(circle,#403a34 0 25%,#181512 27% 58%,#312a22 60%);box-shadow:inset 0 0 24px #000,0 6px 18px #000;touch-action:none}#knob{position:absolute;left:39px;top:39px;width:42px;height:42px;border-radius:50%;background:linear-gradient(#80776d,#514b45);border:2px solid #c8ad72;pointer-events:none}
#attack{position:fixed;z-index:30;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:4px ridge #aa813e;background:radial-gradient(circle at 40% 35%,#e15b48,#8b150e 62%,#2b0302);color:#fff0c8;font:700 15px Georgia;box-shadow:0 6px 18px #000;touch-action:none}#ability{position:fixed;z-index:30;right:max(105px,calc(env(safe-area-inset-right) + 105px));bottom:max(110px,calc(env(safe-area-inset-bottom) + 110px));width:70px;height:70px;border-radius:50%;border:3px ridge #8e753f;background:radial-gradient(circle,#5576b5,#172c59 68%,#080d1b);color:#eef4ff;font:700 11px Georgia;touch-action:none}
#sound{position:fixed;z-index:40;left:50%;top:55%;transform:translate(-50%,-50%);padding:12px 18px;border:2px solid #c89d52;border-radius:999px;background:#160e08;color:#f3d9a2;font:700 15px Georgia}#sound.hidden{display:none}
@media(orientation:portrait){body:after{content:'Rotate your iPhone to landscape';position:fixed;inset:0;display:grid;place-items:center;background:#070504;color:white;z-index:99;font:22px Georgia}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="panel health"><b>GUARDIAN · LEVEL 1</b><div class="bar"><i></i></div></div><div class="panel title">CRYPTBOUND<small>THE FORGOTTEN CRYPT</small></div><div class="panel party"><div>RANGER<span></span></div><div>ARCANIST<span></span></div><div>WARDEN<span></span></div></div><div class="panel objective"><b>OBJECTIVE</b><br>Clear the crypt</div></div>
<div id="joy"><div id="knob"></div></div><button id="ability">WHIRL</button><button id="attack">ATTACK</button><button id="sound">🔊 Enable sound</button>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
const soundBtn=document.getElementById('sound'),joyEl=document.getElementById('joy'),knobEl=document.getElementById('knob'),attackEl=document.getElementById('attack'),abilityEl=document.getElementById('ability');
let audioCtx=null,gameScene=null;const moveInput={x:0,y:0};
function tone(f,d=.08,v=.05,type='triangle',end=f){if(!audioCtx||audioCtx.state!=='running')return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(audioCtx.destination);o.start(n);o.stop(n+d)}
function unlock(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();soundBtn.classList.add('hidden');tone(520,.08,.05,'sine',760)}catch(e){soundBtn.textContent='Sound unavailable'}}soundBtn.onpointerdown=e=>{e.preventDefault();unlock()};
let joyId=null,joyX=0,joyY=0;joyEl.onpointerdown=e=>{e.preventDefault();unlock();joyId=e.pointerId;joyX=e.clientX;joyY=e.clientY;joyEl.setPointerCapture(e.pointerId)};joyEl.onpointermove=e=>{if(e.pointerId!==joyId)return;let dx=e.clientX-joyX,dy=e.clientY-joyY,m=Math.hypot(dx,dy),lim=48;if(m>lim){dx*=lim/m;dy*=lim/m}moveInput.x=dx/lim;moveInput.y=dy/lim;knobEl.style.transform=`translate(${dx}px,${dy}px)`};function stopJoy(e){if(e.pointerId!==joyId)return;joyId=null;moveInput.x=moveInput.y=0;knobEl.style.transform='translate(0,0)'}joyEl.onpointerup=stopJoy;joyEl.onpointercancel=stopJoy;
attackEl.onpointerdown=e=>{e.preventDefault();unlock();gameScene?.playerAttack()};abilityEl.onpointerdown=e=>{e.preventDefault();unlock();gameScene?.whirlwind()};
class Main extends Phaser.Scene{
 constructor(){super('main');this.lastAttack=0;this.lastWhirl=0}
 create(){gameScene=this;this.physics.world.setBounds(0,0,2400,1600);this.cameras.main.setBounds(0,0,2400,1600);this.makeTextures();this.drawDungeon();
  this.player=this.physics.add.sprite(420,380,'guardian').setScale(.62).setCollideWorldBounds(true).setDepth(8);this.player.body.setCircle(25,18,30);
  this.allies=[this.makeAlly(350,440,'ranger','Ranger'),this.makeAlly(350,320,'mage','Arcanist'),this.makeAlly(440,470,'warden','Warden')];
  this.enemies=this.physics.add.group();[[900,430],[1120,680],[1550,420],[1750,980],[2050,1100],[1280,1120],[820,1180],[1960,350]].forEach((p,i)=>this.makeEnemy(p[0],p[1],i%4===0));
  this.physics.add.collider(this.player,this.walls);this.allies.forEach(a=>this.physics.add.collider(a,this.walls));this.physics.add.collider(this.enemies,this.walls);
  this.cameras.main.startFollow(this.player,true,.12,.12);this.cameras.main.setDeadzone(260,150);this.cameras.main.setZoom(.95);this.add.text(2200,1535,'PHASER ART BUILD 2',{font:'12px Georgia',color:'#b99558'}).setDepth(30)
 }
 makeTextures(){const g=this.make.graphics({add:false});
  const actor=(key,c1,c2,accent,weapon)=>{g.clear();g.fillStyle(0x000000,.45);g.fillEllipse(48,83,50,15);g.fillStyle(c2);g.fillTriangle(48,27,19,82,77,82);g.fillStyle(c1);g.fillRoundedRect(28,31,40,42,9);g.fillStyle(0x26221e);g.fillRect(31,54,34,5);g.fillStyle(0xc9b69f);g.fillCircle(48,22,14);g.fillStyle(accent);g.fillTriangle(35,15,49,2,67,17);g.fillStyle(weapon);g.fillRect(65,45,39,6);g.fillStyle(0x8b6a36);g.fillRect(62,43,8,10);g.generateTexture(key,110,94)};
  actor('guardian',0xaab1b4,0x214d7a,0x8e251d,0xe7e2d6);actor('ranger',0x725039,0x285c33,0x24432b,0xd7aa54);actor('mage',0x674a91,0x304d8c,0x6d8ee0,0x8ab3ff);actor('warden',0xb79c58,0xe8dcc0,0xd6b85e,0x8a642f);
  g.clear();g.fillStyle(0x000000,.45);g.fillEllipse(40,74,44,14);g.lineStyle(6,0xd2c7ae);g.beginPath();g.moveTo(40,20);g.lineTo(40,63);g.moveTo(23,37);g.lineTo(58,41);g.moveTo(40,63);g.lineTo(27,82);g.moveTo(40,63);g.lineTo(54,82);g.strokePath();g.fillStyle(0xd8ceb8);g.fillCircle(40,16,14);g.fillStyle(0x211912);g.fillCircle(35,14,3);g.fillCircle(45,14,3);g.fillStyle(0xb5b1a7);g.fillRect(57,30,34,6);g.generateTexture('skeleton',94,90);
  g.clear();g.fillStyle(0x302922);g.fillRect(0,0,64,64);g.fillStyle(0x3d342b);g.fillRect(2,2,60,60);g.lineStyle(2,0x655542,.65);g.strokeRect(2,2,60,60);g.lineStyle(1,0x1d1814,.8);g.lineBetween(8,18,52,31);g.lineBetween(20,4,38,56);g.lineBetween(4,48,27,39);g.generateTexture('floor',64,64);
  g.clear();g.fillStyle(0x29231d);g.fillRect(0,0,64,64);for(let y=0;y<64;y+=16){for(let x=((y/16)%2)*16;x<64;x+=32){g.fillStyle((x+y)%64?0x5b4d3d:0x6b5a46);g.fillRect(x+1,y+1,29,13);g.lineStyle(1,0x201a15);g.strokeRect(x+1,y+1,29,13)}}g.generateTexture('wall',64,64);
  g.clear();g.fillStyle(0x765b36);g.fillRect(0,0,42,42);g.lineStyle(4,0x2c1d11);g.strokeRect(1,1,40,40);g.lineBetween(3,3,39,39);g.lineBetween(39,3,3,39);g.generateTexture('crate',42,42)
 }
 drawDungeon(){this.add.tileSprite(1200,800,2400,1600,'floor');this.walls=this.physics.add.staticGroup();const wall=(x,y,w,h)=>{for(let yy=y;yy<y+h;yy+=64)for(let xx=x;xx<x+w;xx+=64)this.walls.create(xx+32,yy+32,'wall').refreshBody()};
  wall(0,0,2400,64);wall(0,1536,2400,64);wall(0,0,64,1600);wall(2336,0,64,1600);wall(620,0,64,470);wall(620,700,64,300);wall(620,1230,64,370);wall(1180,250,64,600);wall(1180,1080,64,520);wall(1700,0,64,360);wall(1700,600,64,520);wall(1700,1360,64,240);
  [[310,250],[820,900],[1450,300],[1950,780],[2140,1260],[1040,1260]].forEach(([x,y])=>{this.add.circle(x,y,24,0xffa030,.8).setDepth(3);this.add.circle(x,y,85,0xff7518,.09).setDepth(2)});[[520,520],[1000,450],[1450,1000],[2050,640],[800,1320]].forEach(([x,y])=>this.add.image(x,y,'crate').setDepth(4))
 }
 makeAlly(x,y,key,role){const a=this.physics.add.sprite(x,y,key).setScale(.56).setCollideWorldBounds(true).setDepth(8);a.role=role;a.nextAction=0;a.body.setCircle(24,18,28);return a}
 makeEnemy(x,y,brute){const e=this.enemies.create(x,y,'skeleton').setScale(brute?.78:.58).setDepth(7);e.hp=brute?150:60;e.speed=brute?62:92;e.brute=brute;e.body.setCircle(24,14,20);return e}
 playerAttack(){if(this.time.now-this.lastAttack<300)return;this.lastAttack=this.time.now;tone(170,.1,.05,'sawtooth',75);this.tweens.add({targets:this.player,angle:32,duration:90,yoyo:true});this.enemies.children.iterate(e=>{if(e?.active&&Phaser.Math.Distance.Between(this.player.x,this.player.y,e.x,e.y)<120){e.hp-=45;this.tweens.add({targets:e,alpha:.2,duration:65,yoyo:true});tone(70,.08,.06,'triangle',35);if(e.hp<=0)e.destroy()}})}
 whirlwind(){if(this.time.now-this.lastWhirl<1600)return;this.lastWhirl=this.time.now;tone(240,.35,.05,'sine',900);this.tweens.add({targets:this.player,angle:360,duration:420,onComplete:()=>this.player.setAngle(0)});this.enemies.children.iterate(e=>{if(e?.active&&Phaser.Math.Distance.Between(this.player.x,this.player.y,e.x,e.y)<185){e.hp-=35;this.tweens.add({targets:e,alpha:.25,duration:80,yoyo:true});if(e.hp<=0)e.destroy()}})}
 update(){const v=new Phaser.Math.Vector2(moveInput.x,moveInput.y);if(v.length()>1)v.normalize();this.player.setVelocity(v.x*225,v.y*225);this.updateAI()}
 updateAI(){const alive=this.enemies.getChildren().filter(e=>e.active);const nearest=a=>alive.reduce((b,e)=>!b||Phaser.Math.Distance.Between(a.x,a.y,e.x,e.y)<Phaser.Math.Distance.Between(a.x,a.y,b.x,b.y)?e:b,null);
  this.allies.forEach((a,i)=>{const e=nearest(a),d=e?Phaser.Math.Distance.Between(a.x,a.y,e.x,e.y):9999;if((a.role==='Ranger'||a.role==='Arcanist')&&e&&d<420){if(d<165)this.physics.moveTo(a,a.x-(e.x-a.x),a.y-(e.y-a.y),130);else a.setVelocity(0);if(this.time.now>a.nextAction){a.nextAction=this.time.now+(a.role==='Ranger'?650:850);const p=this.add.circle(a.x,a.y,a.role==='Ranger'?4:7,a.role==='Ranger'?0xe4c276:0x78aaff).setDepth(10);this.physics.add.existing(p);this.physics.moveToObject(p,e,380);this.physics.add.overlap(p,this.enemies,(proj,target)=>{if(!target.active)return;target.hp-=a.role==='Ranger'?18:25;proj.destroy();if(target.hp<=0)target.destroy()});this.time.delayedCall(1100,()=>p.active&&p.destroy())}}else if(a.role==='Warden'&&e&&d<145){this.physics.moveToObject(a,e,145);if(this.time.now>a.nextAction){a.nextAction=this.time.now+850;this.tweens.add({targets:a,angle:30,duration:90,yoyo:true});e.hp-=28;if(e.hp<=0)e.destroy()}}else this.follow(a,i)});
  alive.forEach(e=>{if(!e.active)return;const targets=[this.player,...this.allies],t=targets.reduce((b,a)=>!b||Phaser.Math.Distance.Between(e.x,e.y,a.x,a.y)<Phaser.Math.Distance.Between(e.x,e.y,b.x,b.y)?a:b,null);if(t)this.physics.moveToObject(e,t,e.speed)})}
 follow(a,i){const offsets=[[-90,58],[-110,-54],[28,92]][i],tx=this.player.x+offsets[0],ty=this.player.y+offsets[1],d=Phaser.Math.Distance.Between(a.x,a.y,tx,ty);if(d>30)this.physics.moveTo(a,tx,ty,158);else a.setVelocity(0)}
}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:innerWidth,height:innerHeight,backgroundColor:'#070504',physics:{default:'arcade',arcade:{debug:false}},scene:Main,scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH}});
</script></body></html>
