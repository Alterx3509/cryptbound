<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>Cryptbound Phaser</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070504;touch-action:none}#game{width:100%;height:100%}#sound{position:fixed;z-index:10;left:50%;top:55%;transform:translate(-50%,-50%);padding:12px 18px;border:2px solid #c89d52;border-radius:999px;background:#160e08;color:#f3d9a2;font:700 15px Georgia}#sound.hidden{display:none}@media(orientation:portrait){body:after{content:'Rotate your iPhone to landscape';position:fixed;inset:0;display:grid;place-items:center;background:#070504;color:white;z-index:99;font:22px Georgia}}</style></head><body><div id='game'></div><button id='sound'>🔊 Enable sound</button><script src='https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js'></script><script>
const soundBtn=document.getElementById('sound');let audioCtx=null;
function tone(f,d=.08,v=.05){if(!audioCtx||audioCtx.state!=='running')return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(n+d)}
function unlock(){audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();soundBtn.classList.add('hidden');tone(520,.08,.05)}soundBtn.onpointerdown=e=>{e.preventDefault();unlock()};
class Main extends Phaser.Scene{
 constructor(){super('main');this.move={x:0,y:0};this.lastAttack=0;}
 create(){
  this.cameras.main.setBackgroundColor('#080604');this.physics.world.setBounds(0,0,2400,1600);this.cameras.main.setBounds(0,0,2400,1600);
  this.makeTextures();this.drawDungeon();
  this.player=this.physics.add.sprite(420,380,'guardian').setScale(.55).setCollideWorldBounds(true).setDepth(5);this.player.body.setCircle(32,16,18);
  this.allies=[this.makeAlly(350,440,'ranger','Ranger'),this.makeAlly(350,320,'mage','Arcanist'),this.makeAlly(440,470,'warden','Warden')];
  this.enemies=this.physics.add.group();[[900,430],[1120,680],[1550,420],[1750,980],[2050,1100],[1280,1120]].forEach((p,i)=>this.makeEnemy(p[0],p[1],i%3===0));
  this.physics.add.collider(this.player,this.walls);this.allies.forEach(a=>this.physics.add.collider(a,this.walls));this.physics.add.collider(this.enemies,this.walls);
  this.cameras.main.startFollow(this.player,true,.1,.1);this.cameras.main.setDeadzone(240,140);this.cameras.main.setZoom(1.05);
  this.createUI();
 }
 makeTextures(){
  const g=this.make.graphics({x:0,y:0,add:false});
  const hero=(key,body,cloak,weapon)=>{g.clear();g.fillStyle(0x000000,.45);g.fillEllipse(48,86,54,18);g.fillStyle(cloak);g.fillTriangle(48,25,18,85,78,85);g.fillStyle(body);g.fillRoundedRect(28,29,40,44,10);g.fillStyle(0xc9c7bf);g.fillCircle(48,21,16);g.fillStyle(weapon);g.fillRect(66,47,42,7);g.generateTexture(key,112,96)};
  hero('guardian',0xaeb4b6,0x1f4b78,0xe5e1d6);hero('ranger',0x6b4a2b,0x235b31,0xd1a553);hero('mage',0x65488f,0x2f4b8b,0x7faeff);hero('warden',0xb49a55,0xe6d8b6,0xd2b267);
  g.clear();g.fillStyle(0x000000,.45);g.fillEllipse(38,70,45,15);g.lineStyle(7,0xd6ccb4);g.beginPath();g.moveTo(38,18);g.lineTo(38,62);g.moveTo(20,35);g.lineTo(58,40);g.moveTo(38,62);g.lineTo(25,82);g.moveTo(38,62);g.lineTo(53,82);g.strokePath();g.fillStyle(0xd9ceb7);g.fillCircle(38,15,14);g.fillStyle(0xb5b1a7);g.fillRect(52,29,35,6);g.generateTexture('skeleton',90,90);
  g.clear();g.fillStyle(0x2f2922);g.fillRect(0,0,64,64);g.lineStyle(2,0x5d5143,.6);g.strokeRect(0,0,64,64);g.lineBetween(8,18,54,36);g.lineBetween(24,5,40,58);g.generateTexture('floor',64,64);
  g.clear();g.fillStyle(0x40372d);g.fillRect(0,0,64,64);g.fillStyle(0x625441);for(let y=0;y<64;y+=16)for(let x=(y/16%2)*16;x<64;x+=32)g.fillRect(x+2,y+2,28,12);g.generateTexture('wall',64,64);
 }
 drawDungeon(){
  this.add.tileSprite(1200,800,2400,1600,'floor');this.walls=this.physics.add.staticGroup();
  const wall=(x,y,w,h)=>{for(let yy=y;yy<y+h;yy+=64)for(let xx=x;xx<x+w;xx+=64)this.walls.create(xx+32,yy+32,'wall').refreshBody()};
  wall(0,0,2400,64);wall(0,1536,2400,64);wall(0,0,64,1600);wall(2336,0,64,1600);
  wall(620,0,64,470);wall(620,700,64,300);wall(620,1230,64,370);wall(1180,250,64,600);wall(1180,1080,64,520);wall(1700,0,64,360);wall(1700,600,64,520);wall(1700,1360,64,240);
  [[300,240],[820,900],[1450,300],[1950,780],[2140,1260]].forEach(([x,y])=>{this.add.circle(x,y,26,0xff8c28,.7).setDepth(2);this.add.circle(x,y,70,0xff7a18,.08).setDepth(1)});
 }
 makeAlly(x,y,key,role){const a=this.physics.add.sprite(x,y,key).setScale(.5).setCollideWorldBounds(true).setDepth(5);a.role=role;a.nextAction=0;return a}
 makeEnemy(x,y,brute){const e=this.enemies.create(x,y,'skeleton').setScale(brute?.8:.58).setDepth(4);e.hp=brute?150:60;e.speed=brute?65:95;e.brute=brute;e.body.setCircle(28,10,8);return e}
 createUI(){
  this.add.rectangle(126,38,230,55,0x120b07,.9).setStrokeStyle(2,0xb78a43).setScrollFactor(0).setDepth(20);this.add.text(22,19,'GUARDIAN  Lv 1',{font:'bold 15px Georgia',color:'#f1d9a2'}).setScrollFactor(0).setDepth(21);
  this.add.rectangle(this.scale.width/2,28,260,42,0x120b07,.9).setStrokeStyle(2,0xb78a43).setScrollFactor(0).setDepth(20);this.add.text(this.scale.width/2,27,'THE FORGOTTEN CRYPT',{font:'bold 14px Georgia',color:'#e4c47c'}).setOrigin(.5).setScrollFactor(0).setDepth(21);
  const base=this.add.circle(92,this.scale.height-88,62,0x171412,.9).setStrokeStyle(4,0x8c7148).setScrollFactor(0).setDepth(20);const knob=this.add.circle(92,this.scale.height-88,22,0x6d655c).setStrokeStyle(2,0xc5aa72).setScrollFactor(0).setDepth(21);this.input.on('pointerdown',p=>{unlock();if(p.x<this.scale.width*.45){this.joy={id:p.id,x:p.x,y:p.y,knob}}else this.attack()});this.input.on('pointermove',p=>{if(!this.joy||p.id!==this.joy.id)return;let dx=p.x-this.joy.x,dy=p.y-this.joy.y,m=Math.hypot(dx,dy),lim=50;if(m>lim){dx*=lim/m;dy*=lim/m}this.move.x=dx/lim;this.move.y=dy/lim;knob.setPosition(92+dx,this.scale.height-88+dy)});const stop=p=>{if(this.joy&&p.id===this.joy.id){this.joy=null;this.move.x=this.move.y=0;knob.setPosition(92,this.scale.height-88)}};this.input.on('pointerup',stop);this.input.on('pointerupoutside',stop);
  this.add.circle(this.scale.width-86,this.scale.height-84,55,0x94180f,.92).setStrokeStyle(4,0xb98b43).setScrollFactor(0).setDepth(20);this.add.text(this.scale.width-86,this.scale.height-84,'ATTACK',{font:'bold 14px Georgia',color:'#fff0c8'}).setOrigin(.5).setScrollFactor(0).setDepth(21);
 }
 attack(){if(this.time.now-this.lastAttack<320)return;this.lastAttack=this.time.now;tone(170,.09,.04);this.tweens.add({targets:this.player,angle:28,duration:90,yoyo:true});this.enemies.children.iterate(e=>{if(e&&e.active&&Phaser.Math.Distance.Between(this.player.x,this.player.y,e.x,e.y)<115){e.hp-=45;this.tweens.add({targets:e,alpha:.25,duration:60,yoyo:true});tone(70,.08,.05);if(e.hp<=0)e.destroy()}})}
 update(){const v=new Phaser.Math.Vector2(this.move.x,this.move.y);if(v.length()>1)v.normalize();this.player.setVelocity(v.x*220,v.y*220);this.updateAI();}
 updateAI(){
  const alive=this.enemies.getChildren().filter(e=>e.active);const nearest=(a)=>alive.reduce((b,e)=>!b||Phaser.Math.Distance.Between(a.x,a.y,e.x,e.y)<Phaser.Math.Distance.Between(a.x,a.y,b.x,b.y)?e:b,null);
  this.allies.forEach((a,i)=>{const e=nearest(a),d=e?Phaser.Math.Distance.Between(a.x,a.y,e.x,e.y):9999;
   if(a.role==='Ranger'||a.role==='Arcanist'){if(e&&d<360){if(d<170)this.physics.moveToObject(a,{x:a.x-(e.x-a.x),y:a.y-(e.y-a.y)},125);else a.setVelocity(0);if(this.time.now>a.nextAction){a.nextAction=this.time.now+(a.role==='Ranger'?700:900);const p=this.add.circle(a.x,a.y,a.role==='Ranger'?4:7,a.role==='Ranger'?0xe1bf74:0x79aaff).setDepth(6);this.physics.add.existing(p);this.physics.moveToObject(p,e,360);this.time.delayedCall(900,()=>p.destroy())}}else this.follow(a,i)}
   else if(a.role==='Warden'){if(e&&d<120){this.physics.moveToObject(a,e,150);if(this.time.now>a.nextAction){a.nextAction=this.time.now+900;this.tweens.add({targets:a,angle:35,duration:100,yoyo:true});e.hp-=25;if(e.hp<=0)e.destroy()}}else this.follow(a,i)}
  });alive.forEach(e=>{const t=[this.player,...this.allies].reduce((b,a)=>!b||Phaser.Math.Distance.Between(e.x,e.y,a.x,a.y)<Phaser.Math.Distance.Between(e.x,e.y,b.x,b.y)?a:b,null);if(t)this.physics.moveToObject(e,t,e.speed)});
 }
 follow(a,i){const offsets=[[-85,55],[-105,-50],[20,90]][i],tx=this.player.x+offsets[0],ty=this.player.y+offsets[1],d=Phaser.Math.Distance.Between(a.x,a.y,tx,ty);if(d>28)this.physics.moveTo(a,tx,ty,155);else a.setVelocity(0)}
}
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:window.innerWidth,height:window.innerHeight,backgroundColor:'#070504',physics:{default:'arcade',arcade:{debug:false}},scene:Main,scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH}});
</script></body></html>
