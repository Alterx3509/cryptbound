<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cryptbound V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;touch-action:none;font-family:Georgia,serif;color:#f4dfad}#arena{position:fixed;inset:0;background:#100b08 url('https://img.itch.zone/aW1nLzExNjQzMTQ2LnBuZw==/original/VSmSPQ.png') center/cover no-repeat;overflow:hidden}#arena:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 52% 52%,transparent 25%,rgba(0,0,0,.74) 100%);pointer-events:none}.hud{position:fixed;z-index:8;border:2px solid #896832;background:linear-gradient(#22170eeb,#080604e8);box-shadow:inset 0 0 0 1px #d0a151,0 4px 15px #000}.title{left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);padding:8px 28px;text-align:center;letter-spacing:.1em}.title small{display:block;color:#bd9c66;font-size:10px}.health{left:max(10px,env(safe-area-inset-left));top:10px;width:235px;padding:8px}.health strong{font-size:13px}.bar{height:12px;margin-top:5px;background:#1b0806;border:1px solid #b28b4d}.bar i{display:block;width:100%;height:100%;background:linear-gradient(#d85043,#7b100d)}.objective{right:max(12px,env(safe-area-inset-right));top:10px;padding:10px 14px;font-size:12px}.objective b{color:#e0b95e}.party{position:fixed;z-index:8;left:max(10px,env(safe-area-inset-left));top:72px;width:155px}.member{height:42px;margin:5px 0;padding:6px 8px 4px 44px;position:relative;font-size:10px}.portrait{position:absolute;left:-2px;top:-2px;width:42px;height:42px;border-radius:50%;border:2px solid #a27a39;background-image:url('https://img.itch.zone/aW1nLzEyODExNzM4LnBuZw==/original/pGaSc4.png');background-size:370px auto;background-position:center}.member:nth-child(2) .portrait{background-position:35% 35%}.member:nth-child(3) .portrait{background-position:66% 38%}.member:nth-child(4) .portrait{background-position:85% 35%}.mini{height:5px;background:#160907;border:1px solid #73562e;margin-top:4px}.mini i{display:block;width:90%;height:100%;background:#4f8c42}.actor{position:absolute;z-index:5;width:76px;height:110px;transform:translate(-50%,-80%);filter:drop-shadow(0 12px 8px #000);pointer-events:none}.actor .cloak{position:absolute;left:14px;top:32px;width:48px;height:64px;background:linear-gradient(135deg,#203e69,#0b1b35);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:30%}.actor .body{position:absolute;left:20px;top:27px;width:38px;height:48px;border-radius:12px;background:linear-gradient(90deg,#596168,#c0c4c3 45%,#555d62);border:2px solid #252525}.actor .head{position:absolute;left:25px;top:8px;width:28px;height:29px;border-radius:50% 50% 42% 42%;background:linear-gradient(90deg,#70787d,#d3d6d3 50%,#656d72);border:2px solid #202020}.actor .plume{position:absolute;left:36px;top:-4px;width:27px;height:20px;background:#8e231a;clip-path:polygon(0 100%,35% 0,100% 20%,45% 100%)}.actor .shield{position:absolute;left:3px;top:38px;width:29px;height:39px;border-radius:50%;background:linear-gradient(135deg,#466685,#172e4b);border:3px solid #c39c50}.actor .sword{position:absolute;left:53px;top:42px;width:56px;height:8px;transform-origin:4px 4px;transform:rotate(-30deg);background:linear-gradient(#fff,#aaa);clip-path:polygon(0 30%,82% 30%,100% 50%,82% 70%,0 70%)}.actor.attacking .sword{animation:swing .32s ease-out}@keyframes swing{0%{transform:rotate(-105deg)}100%{transform:rotate(55deg)}}.enemy{position:absolute;z-index:4;width:58px;height:83px;transform:translate(-50%,-75%);filter:drop-shadow(0 9px 6px #000);pointer-events:none}.enemy .skull{position:absolute;left:17px;top:2px;width:27px;height:25px;border-radius:50%;background:#d8ceb8;border:2px solid #3c3428}.enemy .skull:after{content:'••';position:absolute;left:6px;top:5px;color:#2b1710;font-weight:bold;letter-spacing:3px}.enemy .bones{position:absolute;left:25px;top:25px;width:9px;height:42px;background:#d5cbb4;box-shadow:-14px 8px 0 -2px #d5cbb4,14px 8px 0 -2px #d5cbb4}.enemy .weapon{position:absolute;left:39px;top:30px;width:43px;height:5px;background:#bbb;transform:rotate(-42deg);transform-origin:left}.enemy.brute{transform:translate(-50%,-78%) scale(1.45)}.enemy.brute .skull{background:#806451}.enemy.brute .bones{width:28px;left:15px;border-radius:15px;background:#4e372c}.joy{position:fixed;z-index:10;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;border:4px ridge #8b7048;background:radial-gradient(circle,#3c3731 0 25%,#171513 27% 58%,#302921 60%);box-shadow:inset 0 0 22px #000,0 5px 18px #000}.knob{position:absolute;left:39px;top:39px;width:42px;height:42px;border-radius:50%;background:#6c645b;border:2px solid #c5a970;pointer-events:none}.attack{position:fixed;z-index:10;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:4px ridge #aa813e;background:radial-gradient(circle at 40% 35%,#df5947,#85120d 62%,#2a0302);color:#fff0c8;font:700 15px Georgia;box-shadow:0 5px 18px #000}.sound{position:fixed;z-index:20;left:50%;top:55%;transform:translate(-50%,-50%);padding:12px 20px;border-radius:999px;border:2px solid #d1aa5b;background:#130d08ee;color:#f5dfaa;font-weight:bold}.sound.hidden{display:none}.bounds{position:absolute;left:19%;right:18%;top:17%;bottom:13%;border:1px solid rgba(217,175,94,.18);pointer-events:none;z-index:2}@media(orientation:portrait){body:after{content:'Rotate your iPhone to landscape';position:fixed;inset:0;display:grid;place-items:center;background:#070504;z-index:99;font-size:22px}}
</style>
</head>
<body>
<div id="arena"><div class="bounds"></div><div id="hero" class="actor"><div class="cloak"></div><div class="body"></div><div class="head"></div><div class="plume"></div><div class="shield"></div><div class="sword"></div></div></div>
<div class="hud health"><strong>GUARDIAN · LEVEL 1</strong><div class="bar"><i></i></div></div><div class="hud title">CRYPTBOUND<small>THE FORGOTTEN CRYPT</small></div><div class="hud objective"><b>OBJECTIVE</b><br>Defeat the undead</div>
<div class="party"><div class="hud member"><div class="portrait"></div>GUARDIAN<div class="mini"><i></i></div></div><div class="hud member"><div class="portrait"></div>RANGER<div class="mini"><i></i></div></div><div class="hud member"><div class="portrait"></div>ARCANIST<div class="mini"><i></i></div></div><div class="hud member"><div class="portrait"></div>WARDEN<div class="mini"><i></i></div></div></div>
<div id="joy" class="joy"><div id="knob" class="knob"></div></div><button id="attack" class="attack">ATTACK</button><button id="sound" class="sound">🔊 Enable sound</button>
<script>
const arena=document.getElementById('arena'),heroEl=document.getElementById('hero'),joyEl=document.getElementById('joy'),knob=document.getElementById('knob'),attackBtn=document.getElementById('attack'),soundBtn=document.getElementById('sound');
let W=innerWidth,H=innerHeight,last=performance.now(),audio=null,master=null,noiseBuffer=null;const player={x:.5,y:.57,dx:0,dy:0};const joy={active:false,id:null,bx:0,by:0,dx:0,dy:0};const monsters=[];
function resize(){W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
function makeMonster(x,y,brute=false){const e=document.createElement('div');e.className='enemy'+(brute?' brute':'');e.innerHTML='<div class="skull"></div><div class="bones"></div><div class="weapon"></div>';arena.appendChild(e);const m={x,y,e,hp:brute?120:60,brute};monsters.push(m);place(m);return m}makeMonster(.66,.42);makeMonster(.74,.55);makeMonster(.68,.72,true);
function place(o){o.e.style.left=(o.x*100)+'%';o.e.style.top=(o.y*100)+'%'}
function initAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!master){master=audio.createGain();master.gain.value=.34;master.connect(audio.destination);noiseBuffer=audio.createBuffer(1,audio.sampleRate,audio.sampleRate);const d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}soundBtn.classList.add('hidden');tone(440,.08,.05,'sine',720)}catch(e){soundBtn.textContent='Sound unavailable'}}
function tone(f,d=.1,v=.06,type='triangle',end=f){if(!audio||audio.state!=='running')return;const n=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(master);o.start(n);o.stop(n+d)}
function noise(d=.12,v=.15,f=1500){if(!audio||audio.state!=='running')return;const n=audio.currentTime,s=audio.createBufferSource(),b=audio.createBiquadFilter(),g=audio.createGain();s.buffer=noiseBuffer;b.type='bandpass';b.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(b).connect(g).connect(master);s.start(n);s.stop(n+d)}
function sword(){noise(.16,.18,1900);tone(155,.13,.05,'sawtooth',70)}function impact(){noise(.1,.2,350);tone(68,.12,.1,'triangle',35)}soundBtn.addEventListener('pointerdown',e=>{e.preventDefault();initAudio()});
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();joy.active=true;joy.id=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;joyEl.setPointerCapture(e.pointerId)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.bx,dy=e.clientY-joy.by,m=Math.hypot(dx,dy),lim=48;if(m>lim){dx*=lim/m;dy*=lim/m}joy.dx=dx/lim;joy.dy=dy/lim;knob.style.transform=`translate(${dx}px,${dy}px)`});function release(e){if(e.pointerId===joy.id){joy.active=false;joy.id=null;joy.dx=joy.dy=0;knob.style.transform='translate(0,0)'}}joyEl.addEventListener('pointerup',release);joyEl.addEventListener('pointercancel',release);
attackBtn.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();heroEl.classList.remove('attacking');void heroEl.offsetWidth;heroEl.classList.add('attacking');sword();for(const m of monsters){if(m.hp<=0)continue;const d=Math.hypot((m.x-player.x)*W,(m.y-player.y)*H);if(d<135){m.hp-=40;impact();m.e.style.filter='brightness(2) drop-shadow(0 9px 6px #000)';setTimeout(()=>m.e.style.filter='',90);if(m.hp<=0){m.e.style.transition='opacity .25s,transform .25s';m.e.style.opacity='0';m.e.style.transform+=' scale(.4)'}}}});
function update(dt){player.x+=joy.dx*.26*dt;player.y+=joy.dy*.38*dt;player.x=Math.max(.22,Math.min(.80,player.x));player.y=Math.max(.23,Math.min(.83,player.y));heroEl.style.left=(player.x*100)+'%';heroEl.style.top=(player.y*100)+'%';for(const m of monsters){if(m.hp<=0)continue;const dx=player.x-m.x,dy=player.y-m.y,d=Math.hypot(dx,dy)||1;if(d>.11){m.x+=dx/d*.018*dt;m.y+=dy/d*.026*dt;place(m)}}}
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body></html>
