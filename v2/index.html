<!doctype html>
<html lang="en">
<head>

<title>Cryptbound V2.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;touch-action:none;font-family:Georgia,serif;color:#f4dfad}button{font:inherit}.viewport{position:fixed;inset:0;overflow:hidden;background:#070503}.world{position:absolute;width:2200px;height:1400px;transform-origin:0 0;background-color:#211b16;background-image:radial-gradient(circle at 18px 14px,#3f352b 0 2px,transparent 3px),radial-gradient(circle at 54px 43px,#17120f 0 3px,transparent 4px),linear-gradient(135deg,transparent 45%,rgba(117,93,64,.18) 46% 48%,transparent 49%),linear-gradient(45deg,transparent 46%,rgba(0,0,0,.28) 47% 49%,transparent 50%);background-size:72px 58px,96px 82px,74px 58px,74px 58px;box-shadow:inset 0 0 180px #000}.world:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 40%,rgba(0,0,0,.55) 100%)}.room{position:absolute;border:20px solid #15110e;background:rgba(53,43,34,.2);box-shadow:inset 0 0 0 5px #5a4a37,inset 0 0 60px #000,0 18px 30px #000}.room:before{content:'';position:absolute;inset:-14px;background:repeating-linear-gradient(90deg,#62533f 0 42px,#3b3127 42px 47px);height:14px;top:-14px;box-shadow:0 5px 6px #000}.r1{left:120px;top:130px;width:720px;height:520px}.r2{left:790px;top:360px;width:670px;height:560px}.r3{left:1390px;top:120px;width:650px;height:500px}.r4{left:1260px;top:850px;width:690px;height:430px}.corridor{position:absolute;background:#312820;border:14px solid #15110e;box-shadow:inset 0 0 0 4px #594936}.c1{left:780px;top:500px;width:170px;height:150px}.c2{left:1390px;top:460px;width:160px;height:150px}.c3{left:1420px;top:780px;width:150px;height:180px}.prop{position:absolute;z-index:2;filter:drop-shadow(8px 14px 7px #000)}.pillar{width:54px;height:112px;background:linear-gradient(90deg,#26211c,#776653 45%,#302820);border:4px solid #17120f}.pillar:before,.pillar:after{content:'';position:absolute;left:-10px;width:66px;height:14px;background:#665744;border:3px solid #211a15}.pillar:before{top:-10px}.pillar:after{bottom:-10px}.torch{width:10px;height:42px;background:#5a3c20}.torch:after{content:'';position:absolute;left:-18px;top:-27px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#fff3a0 0 10%,#ff9b28 22%,rgba(255,91,0,.4) 40%,transparent 70%);animation:flicker .18s infinite alternate}@keyframes flicker{to{transform:scale(.88) translateY(3px);filter:brightness(1.3)}}.bones{width:58px;height:22px;border-top:5px solid #c9bea6;border-bottom:5px solid #c9bea6;transform:rotate(18deg);opacity:.75}.crate{width:52px;height:52px;background:linear-gradient(45deg,#4e321d,#7b5230);border:5px solid #2b1b10}.actor{position:absolute;width:86px;height:116px;transform:translate(-50%,-78%);z-index:5;filter:drop-shadow(0 14px 8px #000);pointer-events:none}.actor .shadow{position:absolute;left:11px;top:85px;width:64px;height:20px;border-radius:50%;background:#0009}.actor .cloak{position:absolute;left:16px;top:34px;width:54px;height:68px;clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:25%}.actor .body{position:absolute;left:23px;top:29px;width:42px;height:52px;border-radius:13px;border:3px solid #201b17}.actor .head{position:absolute;left:27px;top:7px;width:34px;height:34px;border-radius:50%;border:3px solid #211c17}.actor .weapon{position:absolute;left:58px;top:48px;transform-origin:5px 5px}.guardian .cloak{background:linear-gradient(135deg,#315b8e,#08182f)}.guardian .body{background:linear-gradient(90deg,#4c545a,#d2d5d2 48%,#4c555b)}.guardian .head{background:linear-gradient(90deg,#687177,#e1e3df 50%,#596167)}.guardian .head:after{content:'';position:absolute;left:12px;top:-18px;width:30px;height:23px;background:#8d2119;clip-path:polygon(0 100%,30% 0,100% 25%,45% 100%)}.guardian .shield{position:absolute;left:0;top:43px;width:34px;height:43px;border-radius:50%;background:linear-gradient(135deg,#49698a,#142b47);border:4px solid #c39a4b}.guardian .weapon{width:65px;height:9px;background:linear-gradient(#fff,#9da2a1);clip-path:polygon(0 25%,83% 25%,100% 50%,83% 75%,0 75%);transform:rotate(-28deg)}.guardian.attacking .weapon{animation:swing .34s ease-out}@keyframes swing{0%{transform:rotate(-110deg)}100%{transform:rotate(62deg)}}.ranger .cloak{background:linear-gradient(135deg,#315c34,#102417)}.ranger .body{background:#5a3e25}.ranger .head{background:#b88e68}.ranger .weapon{width:42px;height:58px;border:4px solid #d2a657;border-left:0;border-radius:0 50% 50% 0;transform:rotate(0)}.arcanist .cloak{background:linear-gradient(135deg,#38548e,#171d48)}.arcanist .body{background:#58407d}.arcanist .head{background:#ccb69e}.arcanist .weapon{width:8px;height:66px;background:#6f8fd7;transform:rotate(-12deg)}.arcanist .weapon:after{content:'';position:absolute;left:-12px;top:-18px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,#fff,#76aaff 35%,transparent 70%);animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.25)}}.warden .cloak{background:linear-gradient(135deg,#efe1bd,#6b5730)}.warden .body{background:#b89a52}.warden .head{background:#d2c5aa}.warden .weapon{width:52px;height:9px;background:#75542e;transform:rotate(38deg)}.warden .weapon:after{content:'';position:absolute;right:-18px;top:-8px;width:24px;height:24px;background:#c7ab64;border:3px solid #5a4826}.enemy{position:absolute;width:70px;height:92px;transform:translate(-50%,-76%);z-index:4;filter:drop-shadow(0 12px 7px #000);pointer-events:none}.enemy .skull{position:absolute;left:21px;top:0;width:30px;height:29px;border-radius:50%;background:#d8ceb6;border:3px solid #332a20}.enemy .skull:after{content:'••';position:absolute;left:5px;top:5px;color:#281811;letter-spacing:4px}.enemy .rib{position:absolute;left:28px;top:27px;width:15px;height:43px;border-left:5px solid #d2c7ae;border-right:5px solid #d2c7ae}.enemy .arm{position:absolute;left:39px;top:34px;width:44px;height:5px;background:#d2c7ae;transform:rotate(-28deg)}.enemy .blade{position:absolute;left:62px;top:18px;width:43px;height:5px;background:#aaa;transform:rotate(-42deg)}.enemy.brute{transform:translate(-50%,-78%) scale(1.45)}.enemy.brute .rib{width:30px;left:21px;background:#4b3529;border:0;border-radius:14px}.hud{position:fixed;z-index:20;border:2px solid #8d6a35;background:linear-gradient(#24180eee,#080604ed);box-shadow:inset 0 0 0 1px #d3a456,0 4px 15px #000}.health{left:max(10px,env(safe-area-inset-left));top:10px;width:220px;padding:8px}.bar{height:11px;margin-top:4px;background:#190806;border:1px solid #ae8647}.bar i{display:block;width:100%;height:100%;background:linear-gradient(#d74b3e,#76100d)}.title{left:50%;top:8px;transform:translateX(-50%);padding:8px 28px;text-align:center}.title small{display:block;color:#b99a66;font-size:10px}.objective{right:max(10px,env(safe-area-inset-right));top:10px;padding:9px 13px;font-size:12px}.party{position:fixed;z-index:20;left:max(10px,env(safe-area-inset-left));top:68px;width:150px}.member{height:35px;margin:4px 0;padding:6px 8px;font-size:10px}.member i{display:block;height:4px;margin-top:3px;background:#4c9048}.joy{position:fixed;z-index:25;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;border:4px ridge #8b7048;background:radial-gradient(circle,#3c3731 0 25%,#171513 27% 58%,#302921 60%);box-shadow:inset 0 0 22px #000,0 5px 18px #000}.knob{position:absolute;left:39px;top:39px;width:42px;height:42px;border-radius:50%;background:#6c645b;border:2px solid #c5a970;pointer-events:none}.attack{position:fixed;z-index:25;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:4px ridge #aa813e;background:radial-gradient(circle at 40% 35%,#df5947,#85120d 62%,#2a0302);color:#fff0c8;font-weight:bold;box-shadow:0 5px 18px #000}.sound{position:fixed;z-index:30;left:50%;top:55%;transform:translate(-50%,-50%);padding:12px 20px;border-radius:999px;border:2px solid #d1aa5b;background:#130d08ee;color:#f5dfaa;font-weight:bold}.sound.hidden{display:none}@media(orientation:portrait){body:after{content:'Rotate your iPhone to landscape';position:fixed;inset:0;display:grid;place-items:center;background:#070504;z-index:99;font-size:22px}}
</style>
</head>
<body>
<div class="viewport"><div id="world" class="world">
<div class="room r1"></div><div class="room r2"></div><div class="room r3"></div><div class="room r4"></div><div class="corridor c1"></div><div class="corridor c2"></div><div class="corridor c3"></div>
<div class="prop pillar" style="left:360px;top:270px"></div><div class="prop pillar" style="left:660px;top:510px"></div><div class="prop pillar" style="left:1040px;top:590px"></div><div class="prop pillar" style="left:1650px;top:310px"></div><div class="prop pillar" style="left:1540px;top:1070px"></div>
<div class="prop torch" style="left:330px;top:325px"></div><div class="prop torch" style="left:1120px;top:480px"></div><div class="prop torch" style="left:1740px;top:260px"></div><div class="prop torch" style="left:1450px;top:1020px"></div>
<div class="prop bones" style="left:520px;top:520px"></div><div class="prop bones" style="left:1250px;top:720px"></div><div class="prop crate" style="left:1840px;top:430px"></div><div class="prop crate" style="left:1620px;top:1110px"></div>
<div id="guardian" class="actor guardian"><div class="shadow"></div><div class="cloak"></div><div class="body"></div><div class="head"></div><div class="shield"></div><div class="weapon"></div></div>
<div id="ranger" class="actor ranger"><div class="shadow"></div><div class="cloak"></div><div class="body"></div><div class="head"></div><div class="weapon"></div></div>
<div id="arcanist" class="actor arcanist"><div class="shadow"></div><div class="cloak"></div><div class="body"></div><div class="head"></div><div class="weapon"></div></div>
<div id="warden" class="actor warden"><div class="shadow"></div><div class="cloak"></div><div class="body"></div><div class="head"></div><div class="weapon"></div></div>
</div></div>
<div class="hud health"><b>GUARDIAN · LEVEL 1</b><div class="bar"><i></i></div></div><div class="hud title">CRYPTBOUND<small>THE FORGOTTEN CRYPT</small></div><div class="hud objective"><b>OBJECTIVE</b><br>Explore the crypt</div>
<div class="party"><div class="hud member">GUARDIAN<i></i></div><div class="hud member">RANGER<i></i></div><div class="hud member">ARCANIST<i></i></div><div class="hud member">WARDEN<i></i></div></div>
<div id="joy" class="joy"><div id="knob" class="knob"></div></div><button id="attack" class="attack">ATTACK</button><button id="sound" class="sound">🔊 Enable sound</button>
<script>
const worldEl=document.getElementById('world'),joyEl=document.getElementById('joy'),knob=document.getElementById('knob'),attackBtn=document.getElementById('attack'),soundBtn=document.getElementById('sound');
const actorEls={Guardian:document.getElementById('guardian'),Ranger:document.getElementById('ranger'),Arcanist:document.getElementById('arcanist'),Warden:document.getElementById('warden')};
let W=innerWidth,H=innerHeight,last=performance.now(),audio=null,master=null,noiseBuffer=null,camX=0,camY=0;const world={w:2200,h:1400};
const player={x:420,y:410,speed:250,attack:0,role:'Guardian'};const allies=[{x:350,y:470,speed:205,role:'Ranger',offsetX:-88,offsetY:54},{x:340,y:350,speed:185,role:'Arcanist',offsetX:-108,offsetY:-50},{x:440,y:500,speed:190,role:'Warden',offsetX:22,offsetY:92}];const joy={active:false,id:null,bx:0,by:0,dx:0,dy:0};const enemies=[];
function resize(){W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
function placeActor(a){actorEls[a.role].style.left=a.x+'px';actorEls[a.role].style.top=a.y+'px'}
function makeEnemy(x,y,brute=false){const e=document.createElement('div');e.className='enemy'+(brute?' brute':'');e.innerHTML='<div class="skull"></div><div class="rib"></div><div class="arm"></div><div class="blade"></div>';worldEl.appendChild(e);const m={x,y,e,hp:brute?140:65,speed:brute?48:72,brute};enemies.push(m);placeEnemy(m)}
function placeEnemy(m){m.e.style.left=m.x+'px';m.e.style.top=m.y+'px'}makeEnemy(1050,570);makeEnemy(1330,690);makeEnemy(1720,370,true);makeEnemy(1600,1080);makeEnemy(1870,1040,true);
function initAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!master){master=audio.createGain();master.gain.value=.34;master.connect(audio.destination);noiseBuffer=audio.createBuffer(1,audio.sampleRate,audio.sampleRate);const d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}soundBtn.classList.add('hidden');tone(440,.08,.05,'sine',720)}catch(e){soundBtn.textContent='Sound unavailable'}}
function tone(f,d=.1,v=.06,type='triangle',end=f){if(!audio||audio.state!=='running')return;const n=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(master);o.start(n);o.stop(n+d)}
function noise(d=.12,v=.15,f=1500){if(!audio||audio.state!=='running')return;const n=audio.currentTime,s=audio.createBufferSource(),b=audio.createBiquadFilter(),g=audio.createGain();s.buffer=noiseBuffer;b.type='bandpass';b.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(b).connect(g).connect(master);s.start(n);s.stop(n+d)}
function sword(){noise(.16,.18,1900);tone(155,.13,.05,'sawtooth',70)}function impact(){noise(.1,.2,350);tone(68,.12,.1,'triangle',35)}soundBtn.addEventListener('pointerdown',e=>{e.preventDefault();initAudio()});
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();joy.active=true;joy.id=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;joyEl.setPointerCapture(e.pointerId)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.bx,dy=e.clientY-joy.by,m=Math.hypot(dx,dy),lim=48;if(m>lim){dx*=lim/m;dy*=lim/m}joy.dx=dx/lim;joy.dy=dy/lim;knob.style.transform=`translate(${dx}px,${dy}px)`});function release(e){if(e.pointerId===joy.id){joy.active=false;joy.id=null;joy.dx=joy.dy=0;knob.style.transform='translate(0,0)'}}joyEl.addEventListener('pointerup',release);joyEl.addEventListener('pointercancel',release);
attackBtn.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();player.attack=.34;const g=actorEls.Guardian;g.classList.remove('attacking');void g.offsetWidth;g.classList.add('attacking');sword();for(const m of enemies){if(m.hp<=0)continue;const d=Math.hypot(m.x-player.x,m.y-player.y);if(d<145){m.hp-=45;impact();m.e.style.filter='brightness(2) drop-shadow(0 12px 7px #000)';setTimeout(()=>m.e.style.filter='',90);if(m.hp<=0){m.e.style.transition='opacity .25s,transform .25s';m.e.style.opacity='0';m.e.style.transform+=' scale(.35)'}}}});
function moveToward(a,tx,ty,dt){const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy)||1;if(d>18){a.x+=dx/d*a.speed*dt;a.y+=dy/d*a.speed*dt}}
function update(dt){player.attack=Math.max(0,player.attack-dt);player.x+=joy.dx*player.speed*dt;player.y+=joy.dy*player.speed*dt;player.x=Math.max(170,Math.min(world.w-170,player.x));player.y=Math.max(160,Math.min(world.h-140,player.y));for(const a of allies)moveToward(a,player.x+a.offsetX,player.y+a.offsetY,dt);for(const m of enemies){if(m.hp<=0)continue;const d=Math.hypot(player.x-m.x,player.y-m.y);if(d<420&&d>75)moveToward(m,player.x,player.y,dt);placeEnemy(m)}const targetX=Math.max(0,Math.min(world.w-W,player.x-W*.5));const targetY=Math.max(0,Math.min(world.h-H,player.y-H*.56));camX+=(targetX-camX)*Math.min(1,dt*6);camY+=(targetY-camY)*Math.min(1,dt*6);worldEl.style.transform=`translate(${-camX}px,${-camY}px)`;placeActor(player);for(const a of allies)placeActor(a)}
function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);requestAnimationFrame(loop)}placeActor(player);allies.forEach(placeActor);requestAnimationFrame(loop);
</script>
</body></html>
