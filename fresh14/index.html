<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Cryptbound Fresh 14</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#130d09;touch-action:none}canvas{display:block;width:100vw;height:100vh}button{position:fixed;z-index:5;top:12px;left:50%;transform:translateX(-50%);padding:9px 16px;border:2px solid #d0a45a;border-radius:22px;background:#160e09;color:#ffe1a0;font:700 14px Georgia}.label{position:fixed;top:14px;left:16px;color:#ffe1a0;font:700 14px Georgia;pointer-events:none}</style></head><body><canvas id="g"></canvas><button id="sound">Enable sound</button><div class="label">CRYPTBOUND · BUILD 14</div><script>'use strict';const c=document.getElementById('g'),x=c.getContext('2d'),b=document.getElementById('sound');let W=1,H=1,last=performance.now(),ac=null;const p={x:0,y:0,a:0};const j={on:false,id:null,bx:0,by:0,dx:0,dy:0};function size(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;p.x=Math.max(90,Math.min(W-90,p.x||W/2));p.y=Math.max(100,Math.min(H-90,p.y||H/2))}addEventListener('resize',size);size();async function sound(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.frequency.setValueAtTime(620,n);o.frequency.exponentialRampToValueAtTime(320,n+.12);g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.001,n+.12);o.connect(g).connect(ac.destination);o.start();o.stop(n+.12);b.textContent='Sound on';setTimeout(()=>b.remove(),400)}b.onclick=sound;c.onpointerdown=e=>{sound();c.setPointerCapture(e.pointerId);if(e.clientX<W*.5){j.on=true;j.id=e.pointerId;j.bx=e.clientX;j.by=e.clientY}else{p.a=.24}};c.onpointermove=e=>{if(e.pointerId!==j.id)return;let dx=e.clientX-j.bx,dy=e.clientY-j.by,m=Math.hypot(dx,dy),L=55;if(m>L){dx*=L/m;dy*=L/m}j.dx=dx/L;j.dy=dy/L};function up(e){if(e.pointerId===j.id){j.on=false;j.id=null;j.dx=j.dy=0}}c.onpointerup=up;c.onpointercancel=up;function diamond(px,py,rx,ry,col){x.fillStyle=col;x.beginPath();x.moveTo(px,py-ry);x.lineTo(px+rx,py);x.lineTo(px,py+ry);x.lineTo(px-rx,py);x.closePath();x.fill();x.strokeStyle='#1b140f';x.stroke()}function hero(){x.save();x.translate(p.x,p.y);x.fillStyle='#0008';x.beginPath();x.ellipse(0,22,24,8,0,0,7);x.fill();x.fillStyle='#193f73';x.beginPath();x.moveTo(-16,-10);x.lineTo(-24,34);x.lineTo(20,29);x.lineTo(15,-9);x.fill();x.fillStyle='#9da4a7';x.fillRect(-14,-17,28,34);x.fillStyle='#d4d4ce';x.beginPath();x.arc(0,-26,12,0,7);x.fill();x.fillStyle='#8f221b';x.beginPath();x.moveTo(0,-41);x.lineTo(22,-31);x.lineTo(3,-25);x.fill();x.fillStyle='#405d7d';x.beginPath();x.ellipse(-20,2,12,17,-.2,0,7);x.fill();x.save();x.translate(14,0);x.rotate(-.9+(p.a>0?(1-p.a/.24)*2:0));x.strokeStyle='#f4efe3';x.lineWidth=8;x.beginPath();x.moveTo(0,0);x.lineTo(45,-22);x.stroke();x.restore();x.restore()}function update(dt){p.a=Math.max(0,p.a-dt);p.x+=j.dx*220*dt;p.y+=j.dy*220*dt;p.x=Math.max(90,Math.min(W-90,p.x));p.y=Math.max(100,Math.min(H-90,p.y))}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#20130d';x.fillRect(0,0,W,H);for(let gy=-10;gy<12;gy++)for(let gx=-14;gx<15;gx++){let px=W/2+gx*54-gy*54,py=H*.55+gx*26+gy*26;diamond(px,py,42,20,(gx+gy)&1?'#493e34':'#382f28')}x.strokeStyle='#b69052';x.lineWidth=3;x.strokeRect(75,85,W-150,H-150);hero()}function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
