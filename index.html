<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090705">
  <title>Cryptbound</title>
  <link rel="manifest" href="manifest.json?v=10">
  <link rel="stylesheet" href="styles.css?v=10">
  <link rel="stylesheet" href="shell.css?v=10">
</head>
<body>
  <canvas id="game" aria-label="Cryptbound game canvas"></canvas>
  <div id="shell" aria-hidden="true">
    <div class="vignette"></div>
    <section class="hero ornate"><div class="portrait">🛡️</div><div class="hero-name">GUARDIAN · LEVEL 7</div><div class="bar-shell"><i></i></div><div class="bar-shell mana"><i></i></div></section>
    <div class="top-title ornate"><strong>FLOOR 1</strong><span>THE FORGOTTEN CRYPTS</span></div>
    <aside class="party"><div class="member ornate"><div class="mini-portrait">🏹</div><b>RANGER</b><div class="mini-bar"><i></i></div></div><div class="member ornate"><div class="mini-portrait">🔮</div><b>ARCANIST</b><div class="mini-bar"><i></i></div></div><div class="member ornate"><div class="mini-portrait">✨</div><b>WARDEN</b><div class="mini-bar"><i></i></div></div></aside>
    <aside class="objective ornate"><div class="map"></div><h3>OBJECTIVE</h3><p>◆ Destroy the portals</p></aside>
    <div class="joy-ring"></div>
    <div class="actions"><div class="action attack-shell"><div><span>⚔</span><br>ATTACK</div></div><div class="action ability-shell"><div><span>🌀</span><br>WHIRLWIND</div></div><div class="action interact-shell"><div><span>✋</span><br>INTERACT</div></div></div>
    <div class="bottom-loot ornate"><div class="slot">🧪<small>3</small></div><div class="slot">🍗<small>2</small></div><div class="slot">🗺️<small>1</small></div></div>
  </div>
  <button id="soundGate" type="button">🔊 Enable sound</button>
  <div id="rotate">Rotate your iPhone to landscape</div>
  <script src="game.js?v=10"></script>
</body>
</html>
