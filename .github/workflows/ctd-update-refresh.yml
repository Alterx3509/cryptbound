name: Harden Cross the Divide updates

on:
  push:
    paths:
      - '.github/workflows/ctd-update-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force installed PWA to check for new builds
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cross-the-divide/index.html')
          s=p.read_text()
          old="if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});"
          new="""if('serviceWorker'in navigator){
  const hadController=!!navigator.serviceWorker.controller;
  let refreshing=false;
  if(hadController)navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload()});
  navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{});
}"""
          if old not in s:
              raise SystemExit('service worker registration marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cross-the-divide/index.html
          git rm .github/workflows/ctd-update-refresh.yml
          git commit -m "Keep installed Cross the Divide apps current"
          git push
