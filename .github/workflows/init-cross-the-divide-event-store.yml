name: Initialize Cross the Divide event store

on:
  push:
    paths:
      - '.github/workflows/init-cross-the-divide-event-store.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create shared anonymous JSON store if missing
        run: |
          set -euo pipefail
          if [ -f cross-the-divide/event-config.json ]; then
            echo "Event store already initialized."
            exit 0
          fi
          response=$(curl -fsS \
            -H 'Content-Type: application/json' \
            --data '{"event":"","updated_at":null}' \
            https://api.jsonstorage.net/v1/json)
          uri=$(python -c 'import json,sys; print(json.load(sys.stdin)["uri"])' <<< "$response")
          if [ -z "$uri" ]; then
            echo "No URI returned from JsonStorage" >&2
            exit 1
          fi
          mkdir -p cross-the-divide
          printf '{\n  "event_store_url": "%s"\n}\n' "$uri" > cross-the-divide/event-config.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cross-the-divide/event-config.json
          git commit -m "Initialize Cross the Divide shared event store"
          git push
