name: Fix CTD group push

on:
  push:
    paths:
      - 'cross-the-divide/patch_push.py'
      - '.github/workflows/ctd-fix-push.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate push fix
        run: |
          python cross-the-divide/patch_push.py
          node --check /tmp/ctd.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cross-the-divide/index.html
          git rm cross-the-divide/patch_push.py .github/workflows/ctd-fix-push.yml .github/workflows/ctd-ntfy-diagnose.yml .github/workflows/ctd-diagnose.yml || true
          git commit -m "Repair Cross the Divide group event push"
          git push
