name: Add CTD bear activity

on:
  push:
    paths:
      - '.github/workflows/ctd-add-bear.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate and validate bear activity
        run: |
          python cross-the-divide/patch_bear.py
          node --check /tmp/ctd-main.mjs
          node --check cross-the-divide/bear.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cross-the-divide/index.html
          git rm cross-the-divide/patch_bear.py .github/workflows/ctd-add-bear.yml
          git commit -m "Add nearby bear activity to Cross the Divide"
          git push
