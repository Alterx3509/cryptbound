name: Verify CTD live 1728

on:
  push:
    paths:
      - '.github/workflows/ctd-verify-live-1728.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public app
        run: |
          ok=0
          for i in $(seq 1 24); do
            curl -fsSL -H 'Cache-Control: no-cache' 'https://alterx3509.github.io/cryptbound/cross-the-divide/?verify=202608181728' -o /tmp/live.html || true
            if grep -q 'Build 2026.08.18.1728' /tmp/live.html && grep -q './official-bear.js' /tmp/live.html; then
              curl -fsSL -H 'Cache-Control: no-cache' 'https://alterx3509.github.io/cryptbound/cross-the-divide/bear-alerts.json?verify=202608181728' -o /tmp/bear-alerts.json || true
              if grep -q 'Russian River Occupancy and Use Restrictions' /tmp/bear-alerts.json; then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = 1
          printf 'verified_build=2026.08.18.1728\nverified_utc=%s\nofficial_bear_module=yes\nofficial_alert_feed=yes\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > cross-the-divide/live-verify.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cross-the-divide/live-verify.txt
          git rm .github/workflows/ctd-verify-live-1728.yml
          git commit -m "Verify live Cross the Divide build 1728"
          git push
