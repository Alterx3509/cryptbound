name: Update Cross the Divide fish counts

on:
  workflow_dispatch:
  push:
    paths:
      - 'cross-the-divide/update_fish_counts.py'
      - '.github/workflows/update-cross-the-divide-fish-counts.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Alaska Fish & Game counts
        run: python cross-the-divide/update_fish_counts.py

      - name: Point app at live repository data
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cross-the-divide/index.html')
          s = p.read_text()
          old = "fetch('./fish-counts.json?'+Date.now())"
          new = "fetch('https://raw.githubusercontent.com/Alterx3509/cryptbound/main/cross-the-divide/fish-counts.json?'+Date.now())"
          if old in s:
              p.write_text(s.replace(old, new))
          PY

      - name: Commit updated data
        run: |
          if git diff --quiet -- cross-the-divide/fish-counts.json cross-the-divide/index.html; then
            echo "No fish-count changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cross-the-divide/fish-counts.json cross-the-divide/index.html
          git commit -m "Update Cross the Divide fish counts"
          git pull --rebase origin main
          git push origin HEAD:main
