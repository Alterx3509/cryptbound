name: Fix Cross the Divide syntax

on:
  push:
    paths:
      - '.github/workflows/ctd-fix-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair, validate, and publish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cross-the-divide/index.html')
          s=p.read_text()
          bad="body.split('\n')"
          good="body.split('\\n')"
          if bad not in s:
              raise SystemExit('broken split marker not found')
          p.write_text(s.replace(bad,good,1))
          s=p.read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/ctd.mjs').write_text(s[a:b])
          PY
          node --check /tmp/ctd.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cross-the-divide/index.html
          git rm .github/workflows/ctd-diagnose.yml .github/workflows/ctd-fix-syntax.yml
          git commit -m "Repair Cross the Divide runtime syntax"
          git push
