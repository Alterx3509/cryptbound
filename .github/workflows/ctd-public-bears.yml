name: Publish CTD public bear activity

on:
  push:
    paths:
      - '.github/workflows/ctd-public-bears.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch build and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cross-the-divide/index.html')
          s=p.read_text()
          s=s.replace('Build 2026.08.18.1728','Build 2026.08.18.1740')
          p.write_text(s)
          p=Path('cross-the-divide/updater.js')
          s=p.read_text().replace("const BUILD='2026.08.18.1728'","const BUILD='2026.08.18.1740'")
          p.write_text(s)
          Path('cross-the-divide/version.json').write_text('{\n  "build": "2026.08.18.1740"\n}\n')
          p=Path('cross-the-divide/service-worker.js')
          s=p.read_text().replace("const CACHE='ctd-shell-v11'","const CACHE='ctd-shell-v12'")
          p.write_text(s)
          PY
          node --check cross-the-divide/bear.js
          node --check cross-the-divide/official-bear.js
          node --check cross-the-divide/updater.js
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('cross-the-divide/index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          js=re.sub(r"^import .*?;\s*",'',m.group(1),count=1,flags=re.S)
          pathlib.Path('/tmp/ctd-main.mjs').write_text(js)
          PY
          node --check /tmp/ctd-main.mjs
      - name: Verify iNaturalist bear API
        shell: bash
        run: |
          curl -fsSL --retry 3 --retry-delay 2 'https://api.inaturalist.org/v1/observations?lat=60.4154&lng=-149.9947&radius=80&taxon_id=41641,41638&d1=2026-07-01&order=desc&order_by=observed_on&per_page=5' -o /tmp/inat.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/inat.json'))
          assert isinstance(j.get('results'),list)
          print('iNaturalist bear query results:',len(j['results']))
          PY
      - name: Commit build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cross-the-divide/index.html cross-the-divide/bear.js cross-the-divide/updater.js cross-the-divide/version.json cross-the-divide/service-worker.js
          git commit -m 'Use public bear observations instead of group reports' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify public Pages build
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 30); do
            curl -fsSL -H 'Cache-Control: no-cache' 'https://alterx3509.github.io/cryptbound/cross-the-divide/?verify=202608181740' -o /tmp/live.html || true
            if grep -q 'Build 2026.08.18.1740' /tmp/live.html && grep -q './bear.js' /tmp/live.html && grep -q './official-bear.js' /tmp/live.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          printf 'verified_build=2026.08.18.1740\nverified_utc=%s\npublic_bear_observations=yes\ngroup_bear_reports=no\nofficial_bear_module=yes\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > cross-the-divide/live-verify.txt
          git add cross-the-divide/live-verify.txt
          git rm .github/workflows/ctd-public-bears.yml
          git commit -m 'Verify live Cross the Divide build 1740'
          git pull --rebase origin main
          git push origin HEAD:main
