name: Patch Cross the Divide

on:
  push:
    paths:
      - '.github/workflows/patch-cross-the-divide-live-event.yml'
      - 'cross-the-divide/patch_live_event.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and publish
        run: |
          python cross-the-divide/patch_live_event.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cross-the-divide/index.html
          git rm cross-the-divide/patch_live_event.py .github/workflows/patch-cross-the-divide-live-event.yml
          git commit -m "Add live group event sync and repair regulations link"
          git push
