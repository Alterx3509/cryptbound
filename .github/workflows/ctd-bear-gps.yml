name: Harden CTD bear GPS

on:
  push:
    paths:
      - '.github/workflows/ctd-bear-gps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate bear GPS handling
        run: |
          python cross-the-divide/patch_bear_gps.py
          node --check cross-the-divide/bear.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cross-the-divide/bear.js
          git rm cross-the-divide/patch_bear_gps.py .github/workflows/ctd-bear-gps.yml
          git commit -m "Require recent GPS for bear reports"
          git push
